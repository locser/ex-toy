services:
  kafka1:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9192:9092"
      - "9193:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9192,CONTROLLER://localhost:9193
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://100.84.208.116:9193
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #  kafka-ui:
  #    container_name: x-toy-kafka-ui
  #    image: provectuslabs/kafka-ui:latest
  #    restart: unless-stopped
  #    ports:
  #      - "8080:8080"
  #    depends_on:
  #      kafka1:
  #        condition: service_healthy
  #    environment:
  #      KAFKA_CLUSTERS_0_NAME: x-toy-cluster
  #      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
  #      DYNAMIC_CONFIG_ENABLED: "true"

  mysql:
    image: mysql:8.0
    container_name: x-toy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: java_demo
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: x-toy-redis
    restart: unless-stopped
    command: redis-server --requirepass GNwHez7OT53ftK5Ui3IOOlg1jUMwKT5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      timeout: 3s
      retries: 5

  x-toy-app:
    image: x-toy-app
    container_name: x-toy-app
    restart: unless-stopped
    ports:
      - "1122:1122"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/java_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PASSWORD: GNwHez7OT53ftK5Ui3IOOlg1jUMwKT5
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092
      JAVA_OPTS: -server -Xms512m -Xmx1536m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -Dspring.profiles.active=docker,kafka
      SPRING_PROFILES_ACTIVE: docker,kafka
    volumes:
      - app_logs:/app/logs

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:1122/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
