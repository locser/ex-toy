services:
  kafka1:
    image: "bitnami/kafka:3.5"
    container_name: x-toy-kafka1
    restart: unless-stopped
    ports:
      - "9192:9092"
      - "9193:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=EXTERNAL://localhost:9193,PLAINTEXT://kafka1:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_KRAFT_CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_RETENTION_MS=604800000
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_NODE_ID=1
      # Message size configurations
      - KAFKA_CFG_MESSAGE_MAX_BYTES=209715200
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=209715200
      - KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES=209715200
      # Network configurations
      - KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES=102400
      - KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES=102400
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics.sh",
          "--list",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    container_name: x-toy-kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      kafka1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: x-toy-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  mysql:
    image: mysql:8.0
    container_name: x-toy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: java_demo
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: x-toy-redis
    restart: unless-stopped
    command: redis-server --requirepass GNwHez7OT53ftK5Ui3IOOlg1jUMwKT5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 3s
      retries: 5

  x-toy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x-toy-app
    restart: unless-stopped
    ports:
      - "1122:1122"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/java_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PASSWORD: GNwHez7OT53ftK5Ui3IOOlg1jUMwKT5
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092
      JAVA_OPTS: -server -Xms512m -Xmx1536m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -Dspring.profiles.active=docker,kafka
      SPRING_PROFILES_ACTIVE: docker,kafka
    volumes:
      - app_logs:/app/logs

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1122/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  prometheus:
    image: prom/prometheus
    container_name: x-toy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: x-toy-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SING_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_LOG_MODE=console file
      - GF_LOG_FILTERS=alerting.notifier.slack:debug alermanager:debug ngalert:debug

  elasticsearch:
    image: elasticsearch:7.17.25
    container_name: x-toy-elasticsearch
    volumes:
      - ./docker/elk/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: "-Xmx256m -Xms256m"
      discovery.type: single-node

  logstash:
    image: logstash:7.17.25
    container_name: x-toy-logstash
    volumes:
      - ./docker/elk/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./docker/elk/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "5033:5000/tcp"
      - "5022:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"

    depends_on:
      - elasticsearch

  kibana:
    image: kibana:7.17.25
    container_name: x-toy-kibana
    volumes:
      - ./docker/elk/kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

  redis-exporter:
    image: oliver006/redis_exporter
    command: -redis.addr redis://x-toy-redis:6379
    ports:
      - 9121:9121

  mysqld-exporter:
    image: prom/mysqld-exporter
    container_name: x-toy-mysqld-exporter
    ports:
      - "9104:9104"
    environment:
      - DATA_SOURCE_NAME=root:password@tcp(mysql:3306)/

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  app_logs:
  kafka_data:
