global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "toy-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["x-toy-app:1122"]

  - job_name: "toy-prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["x-toy-prometheus:9090"]
    metrics_path: "/metrics"

  - job_name: "toy-redis"
    scrape_interval: 5s
    static_configs:
      - targets: ["x-toy-redis:6379"]
    metrics_path: "/metrics"

  - job_name: "toy-node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "toy-mysql-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9104"]
    metrics_path: "/metrics"

  - job_name: "toy-redis-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9121"]
    metrics_path: "/metrics"
