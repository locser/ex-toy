server:
  port: 1122
  tomcat:
    threads:
      max: 200 # default value

spring:
  # application
  application:
    name: exchange.com
  #DBS
  datasource:
    hikari:
      maximum-pool-size: 20 # Số lượng tối đa kết nối
      minimum-idle: 5 # Số lượng kết nối tối thiểu trong pool
    url: jdbc:mysql://localhost:3306/java_demo #${DB_URL}
    username: root #${DB_USERNAME}
    password: password #${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        type: debug
        generate_statistics: false
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
      READ_UNKNOWN_ENUM_VALUES_AS_NULL: true
    property-naming-strategy: SNAKE_CASE
    date-format: dd/MM/yyyy HH:mm
  # Redis server connection settings
  # data:
  #   redis:
  #     host: ${REDIS_HOST} # Host of the Redis server
  #     port: 6379 # Port of the Redis server for connection
  #     password: ${REDIS_PASSWORD} # Password for connecting to the Redis server (default is empty)
  #     lettuce:
  #       pool: # Connection pool settings
  #         max-active: 8 # Maximum number of active connections in the pool (uses -1 for no limit)
  #         max-idle: 8 # Maximum number of idle connections in the pool
  #         min-idle: 0 # Minimum number of idle connections in the pool
  #         max-wait: -1ms # Maximum wait time to get a connection from the pool (uses -1 for no limit)
  #     connect-timeout: 30000 # Connection timeout (in milliseconds)
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: #kafka,grpc,grpc-client

resilience4j:
  circuitbreaker:
    instances:
      checkRandom:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        #        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      backendA:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      backendB:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 3s
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
